<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://www.zerotier.com/wp-content/uploads/2024/10/icon.svg" sizes="32x32">
    <link rel="icon" href="https://www.zerotier.com/wp-content/uploads/2024/10/icon.svg" sizes="192x192">
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="./networks.css">
    <title>选择网络 - ZTPanel</title>
    <style>

    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <div class="header">
        <div class="header-title">ZTPanel</div>
        <div class="header-time">🕐 <span id="refresh-time">--:--:--</span></div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="copyKanbanLink()" title="复制链接">🔗 复制链接</button>
            <button class="btn btn-primary" id="refresh-button" title="刷新数据">🔄 刷新数据</button>
        </div>
    </div>

    <div id="error-message" class="error-msg"></div>

    <div id="mainContent" style="margin-bottom: 1.5rem;">
        <div class="loading-container" id="loadingState">
            <div class="spinner"></div>
            <p>正在连接 ZeroTier 云端...</p>
        </div>
        <div id="errorState" style="display: none;" class="error-container">
            <div class="error-icon">⚠️</div>
            <h2 class="error-title" id="errorTitle">加载失败</h2>
            <p id="errorMessage">未知错误</p>
        </div>
        <div id="networkGrid" class="network-grid"></div>

    </div>

    <div id="pending-section" style="display:none;margin-bottom: 1.5rem;">
        <div class="section-header">
            <div>
                <span class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                                                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                 stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"
                                                 class="lucide lucide-circle-alert ml-1" aria-hidden="true"><circle
                        cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12"
                                                                                                          x2="12.01"
                                                                                                          y1="16"
                                                                                                          y2="16"></line></svg> 客户端连接的未知网络</span>
            </div>
        </div>
        <div id="networkUnknown" class="network-grid"></div>
    </div>


    <footer class="app-footer">
        <div class="footer-inner">

            <div class="footer-left">
                <span class="footer-title">ZTPanel</span>
                <span class="footer-divider">·</span>
                <span class="footer-license" id="footer-license">
        MIT License
      </span>
            </div>

            <div class="footer-right">
                <a href="https://github.com/Zakkoree/ZTPanel" target="_blank" class="footer-link">
        <span class="footer-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .5C5.65.5.75 5.4.75 11.75c0 5.1 3.3 9.4 7.9 10.95.6.1.8-.25.8-.55v-2.15c-3.2.7-3.9-1.55-3.9-1.55-.55-1.35-1.35-1.7-1.35-1.7-1.1-.75.1-.75.1-.75 1.2.1 1.85 1.25 1.85 1.25 1.1 1.85 2.9 1.3 3.6 1 .1-.8.4-1.3.75-1.6-2.55-.3-5.25-1.3-5.25-5.7 0-1.25.45-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.15 0 0 1-.3 3.25 1.2a11.3 11.3 0 0 1 5.9 0c2.25-1.5 3.25-1.2 3.25-1.2.6 1.65.2 2.85.1 3.15.75.8 1.2 1.85 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.45.4.8 1.1.8 2.2v3.25c0 .3.2.65.8.55 4.6-1.55 7.9-5.85 7.9-10.95C23.25 5.4 18.35.5 12 .5z"/>
          </svg>
        </span>
                    GitHub
                </a>
            </div>

        </div>
    </footer>
</div>
<!-- PRE 弹窗 -->
<div id="pre-modal-mask" class="pre-modal-mask" style="display:none;">
    <div class="pre-modal">
        <div class="pre-modal-header">
            <span id="pre-modal-title">内容预览</span>
            <button class="pre-close-btn" onclick="closePreModal()">×</button>
        </div>

        <div class="pre-modal-body">
            <pre id="pre-modal-content"></pre>
        </div>

        <div class="pre-modal-footer">
            <button class="btn btn-outline" onclick="closePreModal()">关闭</button>
            <button class="btn btn-primary" onclick="copyPreContent()">复制</button>
        </div>
    </div>
</div>
<!-- 编辑成员弹窗 -->
<div id="edit-panel-mask" class="edit-mask" style="display:none;">
    <div class="edit-panel">
        <form id="edit-form" autocomplete="off">
            <h2 class="edit-panel-title">编辑网络信息</h2>
            <h1 class="edit-panel-nodeId" id="edit-panel-nodeId"></h1>
            <input type="hidden" id="edit-nodeId"/>

            <div class="edit-form-group">
                <label for="edit-name">名称</label>
                <input id="edit-name" maxlength="20"/>
            </div>
            <div class="edit-form-group">
                <label for="edit-desc">备注</label>
                <input id="edit-desc" maxlength="64"/>
            </div>
            <div class="edit-form-action">
                <button type="button" class="btn btn-outline" id="edit-cancel">取消</button>
                <button type="submit" class="btn btn-primary" id="edit-save"><span class="save-text">保存</span>
                </button>
            </div>
        </form>
    </div>

</div>
<div id="toast" class="toast"></div>

<script src="./networks.js"></script>
</body>
</html>
