<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://www.zerotier.com/wp-content/uploads/2024/10/icon.svg" sizes="32x32">
    <link rel="icon" href="https://www.zerotier.com/wp-content/uploads/2024/10/icon.svg" sizes="192x192">
    <title>ZTPanel</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="./dashboard.css">
    <style>
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-title">ZTPanel</div>
        <div class="header-network-info">
            <span id="network-subtitle">xxxxxxxx</span>
            <button class="btn btn-xs btn-outline btn-switch-network" id="switch-network-btn">切换网络</button>
        </div>

        <div class="header-time">🕐 <span id="refresh-time">--:--:--</span></div>

        <div class="header-actions">
            <button class="btn btn-outline" onclick="copyKanbanLink()" title="复制链接">🔗 复制链接</button>
            <button class="btn btn-primary" id="refresh-button" title="刷新数据">🔄 刷新数据</button>
        </div>
    </div>

    <div id="error-message" class="error-msg"></div>

    <!-- Network Info (放在统计上面) -->
    <div class="overview-card">
        <div class="overview-top">
            <div id="overview-title" class="overview-title">
                <span>loading...</span>
            </div>
        </div>

        <div class="overview-details">
            <div class="network-routes-container">
                <div id="network-routes">
                    loading...
                    <!-- 路由内容由 JS 动态填充 -->
                </div>
            </div>
        </div>

        <div class="overview-stats">
            <div class="stat-inline">
                <div class="num" id="total-members">0</div>
                <div class="stat-label">全部设备</div>
            </div>
            <div class="stat-inline success">
                <div class="num" id="online-members">0</div>
                <div class="stat-label">当前在线</div>
            </div>
            <div class="stat-inline warning">
                <div class="num" id="offline-members">0</div>
                <div class="stat-label">当前离线</div>
            </div>
            <div class="stat-inline danger">
                <div class="num" id="pending-members-count">0</div>
                <div class="stat-label">等待授权</div>
            </div>
        </div>
    </div>

    <!-- Authorized Members -->
    <div class="section">
        <div class="section-header">
            <div>
                <span class="section-title">👥 成员</span>
                <span class="section-count" id="authorized-count"></span>
            </div>
            <div class="filter-group" id="filter-group">
                <button class="filter-btn active" data-section="authorized" data-filter="all"
                        onclick="filterMembers('authorized', 'all', this)">全部
                </button>
                <button class="filter-btn" data-section="authorized" data-filter="online"
                        onclick="filterMembers('authorized', 'online', this)">在线
                </button>
                <button class="filter-btn" data-section="authorized" data-filter="offline"
                        onclick="filterMembers('authorized', 'offline', this)">离线
                </button>
            </div>
        </div>
        <div class="members-grid" id="authorized-members">
            <div class="grid-full">
                <svg style="width: 32px; height: 32px; animation: spin 1s linear infinite; color: var(--primary);"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 3v3m6.364 3.364l-2.121 2.121M21 12h-3m-3.364 6.364l-2.121-2.121M12 21v-3m-6.364-3.364l2.121-2.121M3 12H6m3.364-6.364l2.121 2.121"
                          stroke-linecap="round"></path>
                </svg>
                <div style="margin-left: 1rem; font-size: 0.9rem; color: var(--text-light); display: flex; flex-direction: column; gap: 0.25rem;">
                    <div>正在连接 ZeroTier 云端...</div>
                </div>
            </div>
        </div>

        <!-- Pending Members (仅私有网络显示) -->
        <div class="section" id="pending-section">
            <div class="section-header">
                <div>
                    <span class="section-title">⏳ 待授权</span>
                    <span class="section-count" id="pending-count"></span>
                </div>
            </div>
            <div id="pending-members">
                <div style="display: flex; align-items: center; justify-content: center; width: 100%; min-height: 200px; padding: 2rem;">
                    <svg style="width: 32px; height: 32px; animation: spin 1s linear infinite; color: var(--primary);"
                         viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 3v3m6.364 3.364l-2.121 2.121M21 12h-3m-3.364 6.364l-2.121-2.121M12 21v-3m-6.364-3.364l2.121-2.121M3 12H6m3.364-6.364l2.121 2.121"
                              stroke-linecap="round"></path>
                    </svg>
                    <div style="margin-left: 1rem; font-size: 0.9rem; color: var(--text-light); display: flex; flex-direction: column; gap: 0.25rem;">
                        <div>正在连接 ZeroTier 云端...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <div class="footer-inner">

            <div class="footer-left">
                <span class="footer-title">ZTPanel</span>
                <span class="footer-divider">·</span>
                <span class="footer-license" id="footer-license">
          MIT License
        </span>
            </div>

            <div class="footer-right">
                <a href="https://github.com/Zakkoree/ZTPanel" target="_blank" class="footer-link">
          <span class="footer-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 .5C5.65.5.75 5.4.75 11.75c0 5.1 3.3 9.4 7.9 10.95.6.1.8-.25.8-.55v-2.15c-3.2.7-3.9-1.55-3.9-1.55-.55-1.35-1.35-1.7-1.35-1.7-1.1-.75.1-.75.1-.75 1.2.1 1.85 1.25 1.85 1.25 1.1 1.85 2.9 1.3 3.6 1 .1-.8.4-1.3.75-1.6-2.55-.3-5.25-1.3-5.25-5.7 0-1.25.45-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.15 0 0 1-.3 3.25 1.2a11.3 11.3 0 0 1 5.9 0c2.25-1.5 3.25-1.2 3.25-1.2.6 1.65.2 2.85.1 3.15.75.8 1.2 1.85 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.45.4.8 1.1.8 2.2v3.25c0 .3.2.65.8.55 4.6-1.55 7.9-5.85 7.9-10.95C23.25 5.4 18.35.5 12 .5z"/>
            </svg>
          </span>
                    GitHub
                </a>
            </div>

        </div>
    </footer>
</div>

<!-- 编辑成员弹窗 -->
<div id="edit-panel-mask" class="edit-mask" style="display:none;">
    <div class="edit-panel">
        <form id="edit-form" autocomplete="off">
            <h2 class="edit-panel-title">编辑设备信息</h2>
            <h1 class="edit-panel-nodeId" id="edit-panel-nodeId" ></h1>
            <input type="hidden" id="edit-nodeId"/>

            <div class="edit-form-group">
                <label for="edit-name">名称</label>
                <input id="edit-name" maxlength="20"/>
            </div>
            <div class="edit-form-group">
                <label for="edit-desc">备注</label>
                <input id="edit-desc" maxlength="64"/>
            </div>
            <div class="edit-form-group">
                <label for="edit-ip">IPv4</label>
                <input id="edit-ip" maxlength="15"/>
            </div>
            <div class="edit-form-action">
                <button type="button" class="btn btn-outline" id="edit-cancel">取消</button>
                <button type="submit" class="btn btn-primary" id="edit-save"><span class="save-text">保存</span>
                </button>
            </div>
        </form>
    </div>

</div>

<!-- PRE 弹窗 -->
<div id="pre-modal-mask" class="pre-modal-mask" style="display:none;">
    <div class="pre-modal">
        <div class="pre-modal-header">
            <span id="pre-modal-title">内容预览</span>
            <button class="pre-close-btn" onclick="closePreModal()">×</button>
        </div>

        <div class="pre-modal-body">
            <pre id="pre-modal-content"></pre>
        </div>

        <div class="pre-modal-footer">
            <button class="btn btn-outline" onclick="closePreModal()">关闭</button>
            <button class="btn btn-primary" onclick="copyPreContent()">复制</button>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script src="./dashboard.js"></script>
</body>
</html>
