<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://www.zerotier.com/wp-content/uploads/2024/10/icon.svg" sizes="32x32">
    <link rel="icon" href="https://www.zerotier.com/wp-content/uploads/2024/10/icon.svg" sizes="192x192">
    <title>ZTPanel</title>
    <style>
        html, body, .container {
            max-width: 100vw;
            overflow-x: hidden !important;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            flex-direction: column;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
            overflow: hidden;
            padding: 1rem;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><g fill="%23ffffff" fill-opacity="0.05"><path d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/></g></g></svg>');
            animation: drift 20s infinite linear;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(60px, 60px);
            }
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            width: 100%;
            position: relative;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12),
            0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        /* 背景图 - 居中显示 */
        .card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 35%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background-image: url("https://www.zerotier.com/wp-content/uploads/2026/04/Globe-260323v01-DRAFT.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }

        /* 让内容在伪元素上面 */
        .card > * {
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .logo img {
            width: 60px;
            height: 60px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group input {
            font-size: 16px; /* 关键：防止 iOS 自动缩放触发输入法 */
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-hint {
            display: block;
            margin-top: 0.3rem;
            font-size: 0.8rem;
            color: #999;
        }

        .form-hint a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .submit-button {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .submit-button:disabled {
            cursor: not-allowed;
        }

        .error-message {
            color: #e74c3c;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #ffebee;
            border-radius: 6px;
            display: none;
            border-left: 3px solid #e74c3c;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .container {
                max-width: 100%;
            }

            .card {
                padding: 1.5rem;
                border-radius: 16px;
            }

            /* 手机端缩小背景图 */
            .card::before {
                width: 240px;
                height: 240px;
                opacity: 0.1;
            }

            .header {
                margin-bottom: 1.5rem;
            }

            .logo img {
                width: 50px;
                height: 50px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .form-group label {
                font-size: 0.85rem;
            }

            .form-group input {
                padding: 0.65rem 0.9rem;
                font-size: 16px; /* 防止 iOS 自动缩放 */
            }

            .form-hint {
                font-size: 0.75rem;
            }

            .submit-button {
                padding: 0.75rem;
                font-size: 0.95rem;
                margin-top: 1rem;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 1.25rem;
            }

            .card::before {
                width: 200px;
                height: 200px;
                opacity: 0.08;
            }

            .logo img {
                width: 45px;
                height: 45px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .header p {
                font-size: 0.85rem;
            }

            .form-group input {
                padding: 0.6rem 0.8rem;
                font-size: 16px;
            }

            .submit-button {
                padding: 0.7rem;
                font-size: 0.9rem;
            }
        }

        /* ===== Footer ===== */
        .app-footer {
            margin-top: auto;
            padding: 1.2rem 1rem;
            border-top: 1px solid var(--border);
            opacity: 0;
            transform: translateY(8px);
            animation: footerFadeIn 0.6s ease forwards;
        }

        /* 淡入动画 */
        @keyframes footerFadeIn {
            to {
                opacity: 0.75;
                transform: none;
            }
        }

        .app-footer:hover {
            opacity: 1;
        }

        /* 布局 */
        .footer-inner {
            max-width: var(--container);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        /* 左侧 */
        .footer-left {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 700;
        }

        .footer-title {
            color: var(--text);
            font-weight: 900;
        }

        .footer-divider {
            opacity: 0.5;
        }

        .footer-license {
            opacity: 0.85;
        }

        /* 右侧 */
        .footer-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-light);
            text-decoration: none;
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .footer-link:hover {
            color: var(--primary);
            background: var(--surface-2);
            transform: translateY(-1px);
        }

        /* GitHub SVG */
        .footer-icon svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }

        .footer-link:hover .footer-icon svg {
            transform: scale(1.15);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .app-footer {
                padding: 1rem 0.6rem;
            }

            .footer-inner {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 0.5rem;
            }

            .footer-left {
                justify-content: center;
                flex-wrap: wrap;
            }

            .footer-link {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <div class="logo"><img src="https://www.zerotier.com/wp-content/uploads/2024/10/icon.svg" alt="logo">
            </div>
            <h1>ZTPanel</h1>
            <p>ZeroTier 网络可视化管理</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="form">
            <div class="form-group">
                <label for="token">🔑 访问令牌</label>
                <input type="text" id="token" placeholder="输入访问令牌" required autocomplete="off" maxlength="32">
                <small class="form-hint">在 <a href="https://my.zerotier.com/account#tokens"
                                               target="_blank">令牌页面</a> 获取</small>
            </div>

            <button type="submit" class="submit-button">开始使用</button>
        </form>
    </div>
</div>

<footer class="app-footer">
    <div class="footer-inner">

        <div class="footer-left">
            <span class="footer-title">ZTPanel</span>
            <span class="footer-divider">·</span>
            <span class="footer-license" id="footer-license">
        MIT License
      </span>
        </div>

        <div class="footer-right">
            <a href="https://github.com/Zakkoree/ZTPanel" target="_blank" class="footer-link">
        <span class="footer-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .5C5.65.5.75 5.4.75 11.75c0 5.1 3.3 9.4 7.9 10.95.6.1.8-.25.8-.55v-2.15c-3.2.7-3.9-1.55-3.9-1.55-.55-1.35-1.35-1.7-1.35-1.7-1.1-.75.1-.75.1-.75 1.2.1 1.85 1.25 1.85 1.25 1.1 1.85 2.9 1.3 3.6 1 .1-.8.4-1.3.75-1.6-2.55-.3-5.25-1.3-5.25-5.7 0-1.25.45-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.15 0 0 1-.3 3.25 1.2a11.3 11.3 0 0 1 5.9 0c2.25-1.5 3.25-1.2 3.25-1.2.6 1.65.2 2.85.1 3.15.75.8 1.2 1.85 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.45.4.8 1.1.8 2.2v3.25c0 .3.2.65.8.55 4.6-1.55 7.9-5.85 7.9-10.95C23.25 5.4 18.35.5 12 .5z"/>
          </svg>
        </span>
                GitHub
            </a>
        </div>

    </div>
</footer>
<script>

    /* ===== 自动年份 ===== */
    (function () {
        const el = document.getElementById('footer-license');
        if (el) {
            const year = new Date().getFullYear();
            el.textContent = `MIT License © ${year}`;
        }
    })();
    const tokenInput = document.getElementById('token');

    tokenInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\s/g, '');
    });

    document.getElementById('form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const err = document.getElementById('error-message');
        const btn = document.querySelector('.submit-button');

        err.classList.remove('show');

        const token = tokenInput.value.trim();

        if (token.length !== 32) {
            err.textContent = '❌ 无效访问令牌！';
            err.classList.add('show');
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ 验证中...';

        try {
            const r = await fetch(`/api?token=${encodeURIComponent(token)}&path=${encodeURIComponent('/status')}`);
            if (!r.ok) throw new Error(`API Error => ${r.statusText}`);
            const d = await r.json();
            if (!d.user) {
                throw new Error(`无效访问令牌！`);
            }
            window.location.href = `/networks?token=${encodeURIComponent(token)}`;
        } catch (e) {
            console.error('❌ 验证失败:', e);
            err.textContent = '❌ ' + e.message;
            err.classList.add('show');

            btn.disabled = false;
            btn.textContent = '开始使用';
        }
    });
</script>
</body>
</html>
